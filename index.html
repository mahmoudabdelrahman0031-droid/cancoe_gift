<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cancoé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Marcellus&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ======================================================
     CANCOÉ — إعدادات العلامة التجارية
     غيّر القيم دي بلون ولوجو البراند بتاعك
     ====================================================== */
  :root{
    --brand:        #8A2E3B;   /* اللون الأساسي بتاع اللوجو - غيّريه هنا */
    --brand-dark:   #5A1E27;
    --brand-soft:   #E8C2C9;   /* درجة فاتحة من نفس اللون */
    --cream:        #FBF4EC;
    --cacao:        #2E1B14;
    --gold:         #C9A15A;
    --font-display: 'Cormorant Garamond', 'Marcellus', serif;
    --font-ui:      'Tajawal', sans-serif;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:var(--font-ui);
    background:
      radial-gradient(circle at 15% 0%, color-mix(in srgb, var(--brand) 10%, transparent), transparent 45%),
      radial-gradient(circle at 85% 100%, color-mix(in srgb, var(--gold) 12%, transparent), transparent 45%),
      var(--cream);
    color:var(--cacao);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    overflow-x:hidden;
  }

  /* ---------- الحالات: تحميل / خطأ ---------- */
  #state-screen{
    min-height:100vh; width:100%;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:14px; text-align:center; padding:24px;
  }
  .spinner{
    width:38px; height:38px; border-radius:50%;
    border:3px solid var(--brand-soft); border-top-color:var(--brand);
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  #state-screen p{color:var(--brand-dark); font-size:15px;}

  /* ---------- الهيدر ---------- */
  header{
    width:100%; max-width:640px; padding:56px 24px 28px;
    text-align:center; position:relative;
  }
  .brand-mark{
    font-family:var(--font-display); font-style:italic;
    font-size:15px; letter-spacing:6px; text-transform:uppercase;
    color:var(--brand); margin-bottom:26px; opacity:.85;
  }
  .brand-mark::before, .brand-mark::after{
    content:'✦'; margin:0 10px; font-size:10px; opacity:.6;
  }
  h1#person-name{
    font-family:var(--font-display); font-weight:600;
    font-size:clamp(34px, 9vw, 54px); color:var(--brand-dark);
    line-height:1.15;
  }
  #occasion-line{
    font-family:var(--font-display); font-style:italic;
    font-size:clamp(18px, 4vw, 22px); color:var(--brand);
    margin-top:6px;
  }
  #welcome-msg{
    margin-top:22px; font-size:15.5px; line-height:1.9;
    color:#5c4a3f; max-width:460px; margin-inline:auto;
  }

  hr.divider{
    width:64px; height:2px; border:none; margin:34px auto 0;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  /* ---------- شبكة الصور ---------- */
  #gallery{
    width:100%; max-width:640px; padding:20px;
    display:grid; grid-template-columns:1fr 1fr; gap:14px;
  }
  .photo-card{
    position:relative; aspect-ratio:1/1; border-radius:16px;
    overflow:hidden; cursor:pointer; background:var(--brand-soft);
    box-shadow:0 8px 22px -10px rgba(90,30,39,.35);
    transition:transform .35s ease, box-shadow .35s ease;
  }
  .photo-card:hover{ transform:translateY(-4px); box-shadow:0 14px 28px -10px rgba(90,30,39,.45); }
  .photo-card img{ width:100%; height:100%; object-fit:cover; display:block; }
  .photo-card .hint{
    position:absolute; inset:auto 0 0 0; padding:10px 12px 8px;
    background:linear-gradient(to top, rgba(46,27,20,.72), transparent);
    color:#fff; font-size:12px; text-align:center; opacity:0;
    transition:opacity .3s ease;
  }
  .photo-card:hover .hint, .photo-card:active .hint{ opacity:1; }

  /* ---------- المودال (الكابشن) ---------- */
  #lightbox{
    position:fixed; inset:0; background:rgba(46,27,20,.82);
    display:none; align-items:center; justify-content:center;
    padding:24px; z-index:50; backdrop-filter:blur(3px);
  }
  #lightbox.open{ display:flex; animation:fade .25s ease; }
  @keyframes fade{ from{opacity:0;} to{opacity:1;} }
  .lightbox-box{
    background:var(--cream); border-radius:20px; overflow:hidden;
    max-width:420px; width:100%; box-shadow:0 30px 60px -20px rgba(0,0,0,.5);
  }
  .lightbox-box img{ width:100%; display:block; max-height:50vh; object-fit:cover; }
  .lightbox-caption{
    padding:20px 22px 24px; font-family:var(--font-display);
    font-style:italic; font-size:19px; line-height:1.6; color:var(--brand-dark); text-align:center;
  }
  .lightbox-close{
    position:absolute; top:18px; left:18px; width:36px; height:36px;
    border-radius:50%; background:rgba(255,255,255,.15); color:#fff;
    border:1px solid rgba(255,255,255,.3); font-size:18px; cursor:pointer;
    line-height:1;
  }

  /* ---------- الرسالة الكبيرة ---------- */
  #final-message{
    width:100%; max-width:600px; margin:44px 0 70px; padding:44px 30px;
    background:var(--brand-dark); border-radius:26px; text-align:center;
    color:#fbeee6; position:relative;
  }
  #final-message::before{
    content:'"'; font-family:var(--font-display); font-size:80px;
    color:var(--gold); opacity:.5; line-height:0; display:block; margin-bottom:6px;
  }
  #final-message p{
    font-family:var(--font-display); font-size:clamp(18px,4vw,22px);
    line-height:1.9; font-style:italic;
  }
  #final-message .sign{
    margin-top:22px; font-family:var(--font-ui); font-size:12px;
    letter-spacing:3px; text-transform:uppercase; color:var(--gold); opacity:.85;
  }

  footer{ padding:0 0 40px; font-size:11px; color:#a68f80; letter-spacing:2px; }

  #app{ display:none; width:100%; display:flex; flex-direction:column; align-items:center; }
  #app.show{ display:flex; }
</style>
</head>
<body>

  <div id="state-screen">
    <div class="spinner"></div>
    <p>لحظة، بنجهزلك المفاجأة...</p>
  </div>

  <div id="app">
    <header>
      <div class="brand-mark">Cancoé</div>
      <h1 id="person-name"></h1>
      <div id="occasion-line"></div>
      <p id="welcome-msg"></p>
      <hr class="divider">
    </header>

    <section id="gallery"></section>

    <section id="final-message">
      <p id="final-message-text"></p>
      <div class="sign">Cancoé</div>
    </section>

    <footer>MADE WITH LOVE — CANCOÉ</footer>
  </div>

  <div id="lightbox">
    <div class="lightbox-box">
      <button class="lightbox-close" onclick="closeLightbox()">✕</button>
      <img id="lightbox-img" src="" alt="">
      <div class="lightbox-caption" id="lightbox-caption"></div>
    </div>
  </div>

<script>
/* ======================================================
   إعدادات الربط بجوجل شيت
   ====================================================== */
const SPREADSHEET_ID = "1GDQS0XGVmFfln8_k6w_bYckQxo3fZ5SabhTqBbDipag";
const SHEET_NAME      = "Form Responses 1";           // غيّريه هنا لو اسم التبويبة مختلف

const params = new URLSearchParams(window.location.search);
const rowId  = params.get("id");

function driveDirectLink(url){
  if(!url) return "";
  const match = url.match(/[-\w]{25,}/); // يطلع الـ FILE_ID من أي شكل رابط درايف
  if(!match) return url;
  return `https://drive.google.com/uc?export=view&id=${match[0]}`;
}

function occasionLine(occasion){
  const o = (occasion || "").trim();
  const lower = o.toLowerCase();
  if(o.includes("تخرج") || lower.includes("graduat")) return "مبروك التخرج 🎓";
  if(o.includes("ميلاد") || lower.includes("birthday")) return "كل سنة وانتَ طيب 🎂";
  if(o) return o;
  return "";
}

async function loadData(){
  const stateScreen = document.getElementById("state-screen");
  const app = document.getElementById("app");

  if(rowId === null){
    stateScreen.innerHTML = "<p>الرابط ده مش مكتمل، تأكد إنك استخدمت كود QR الصح.</p>";
    return;
  }

  try{
    const res = await fetch(`https://opensheet.vercel.app/${SPREADSHEET_ID}/${SHEET_NAME}`);
    const rows = await res.json();
    const data = rows[Number(rowId)];

    if(!data){
      stateScreen.innerHTML = "<p>معلش، الرابط ده مش شغال. تواصل مع فريق Cancoé.</p>";
      return;
    }

    document.getElementById("person-name").textContent   = data["Name"] || "";
    document.getElementById("occasion-line").textContent = occasionLine(data["Occasion"]);
    document.getElementById("welcome-msg").textContent   = data["Welcome Message"] || "";
    document.getElementById("final-message-text").textContent = data["Final Message"] || "";

    const gallery = document.getElementById("gallery");
    gallery.innerHTML = "";
    for(let i = 1; i <= 4; i++){
      const imgUrl   = driveDirectLink(data[`Photo${i}`]);
      const caption  = data[`Caption${i}`] || "";
      if(!imgUrl) continue;

      const card = document.createElement("div");
      card.className = "photo-card";
      card.innerHTML = `<img src="${imgUrl}" alt="صورة ${i}"><div class="hint">اضغط لعرض الكابشن</div>`;
      card.addEventListener("click", () => openLightbox(imgUrl, caption));
      gallery.appendChild(card);
    }

    stateScreen.style.display = "none";
    app.classList.add("show");

  }catch(err){
    console.error(err);
    stateScreen.innerHTML = "<p>حصل خطأ في تحميل البيانات، حاول تاني بعد شوية.</p>";
  }
}

function openLightbox(imgUrl, caption){
  document.getElementById("lightbox-img").src = imgUrl;
  document.getElementById("lightbox-caption").textContent = caption;
  document.getElementById("lightbox").classList.add("open");
}
function closeLightbox(){
  document.getElementById("lightbox").classList.remove("open");
}
document.getElementById("lightbox").addEventListener("click", (e)=>{
  if(e.target.id === "lightbox") closeLightbox();
});

loadData();
</script>
</body>
</html>
